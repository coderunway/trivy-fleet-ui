version: '3.8'

services:
  trivy-dashboard:
    image: python:3.11-alpine
    container_name: trivy_fleet_dashboard
    restart: always
    ports:
      - "${DASHBOARD_PORT:-8387}:8080"
    environment:
      - BASE_DIR=${BASE_DIR:-/volume1/docker/trivy}
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
      - ${BASE_DIR:-/volume1/docker/trivy}/reports:/reports
      - ${BASE_DIR:-/volume1/docker/trivy}/cache:/root/.cache/
      - ${BASE_DIR:-/volume1/docker/trivy}/dashboard/app.py:/app/app.py:ro
      - ${BASE_DIR:-/volume1/docker/trivy}/dashboard/static:/app/static:ro
    working_dir: /app
    entrypoint: ["/bin/sh", "-c"]
    command: ["apk add --no-cache docker-cli && python app.py"]